<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image inserter</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: system-ui, -apple-system, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1rem;

  background: linear-gradient(135deg, #ff8a00, #ff3cac, #6a00ff);
  background-size: 200% 200%;
}

h1 {
  font-size: 1.5rem;
  font-weight: 600;
  margin-bottom: 1.5rem;
  color: white;
}

.dropzone {
  width: 100%;
  max-width: 420px;
  min-height: 240px;
  border: 2px dashed rgba(255,255,255,0.5);
  border-radius: 12px;
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(8px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  padding: 2rem;
  cursor: pointer;
}

.dropzone p {
  margin: 0;
  color: rgba(255,255,255,0.8);
  font-size: 0.95rem;
}

.dropzone input {
  display: none;
}

.preview-wrap {
  text-align: center;
}

.preview {
  max-width: 100%;
  max-height: 60vh;
  border-radius: 8px;
  object-fit: contain;
  margin-top: 1rem;
  display: block;
  pointer-events: none;
}

/* Gradient checkmark button: yellow → pink → purple → blue */
.checkmark-btn {
  display: none;
  align-items: center;
  justify-content: center;
  margin-top: 1.5rem;
  width: 56px;
  height: 56px;
  border: none;
  border-radius: 50%;
  background: linear-gradient(135deg, #ffd93d, #ff6b9d, #9d4edd, #4361ee);
  background-size: 300% 300%;
  color: white;
  font-size: 1.75rem;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(0,0,0,0.25);
}

.checkmark-btn:hover {
  filter: brightness(1.05);
}
</style>
</head>

<body>

<h1>Insert an image</h1>

<div class="dropzone" id="dropzone">
  <input type="file" id="file" accept="image/*">
  <p>Drop an image here or click to choose</p>
</div>

<div class="preview-wrap" id="previewWrap" style="display:none;">
  <img class="preview" id="preview" alt="Preview">
</div>

<button type="button" id="checkmarkBtn" class="checkmark-btn" aria-label="Confirm">✓</button>

<script src="app.js"></script>

</body>
</html>
